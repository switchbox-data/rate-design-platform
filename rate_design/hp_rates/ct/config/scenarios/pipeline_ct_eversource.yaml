state: ct
utility: ct_eversource
year: 2025
output_base: /data.sb/switchbox/cairo/outputs/hp_rates
solar_pv_compensation: net_metering
process_workers: 8
max_concurrent_cairo_runs: 2
# true overlaps each stage's delivery + supply runs (each gets half the workers);
# only enable with headroom for two concurrent CAIRO processes
concurrent_variants: false
# sample_size: 200  # optional, limits buildings for smoke testing

resstock:
  base: /ebs/data/nrel/resstock/res_2024_amy2018_2_sb
  upgrade_precalc: "00"
  upgrade_calibrated: "02"
marginal_costs:
  # Each key must match the latest entry in the manifest.yaml beside the file;
  # preflight stops on a mismatch. Keys: context/code/marginal_costs/mc_provenance_manifest.md.
  # dist: OCC-863 Attachment 2 secondary month-hour $/kWh tables expanded onto
  # the 2025 calendar, weekends and federal holidays on the weekend table
  # (dist_mc_method=month_hour, the recipe default). 2025, not 2018, because
  # CAIRO rotates the AMY2018 loads onto 2025's weekdays. Every hour is then
  # scaled by one factor so the year sums to the $21.22/kW-yr in
  # ct_marginal_costs_2025.csv. See ct_eversource_dist_mc_methodology.md §7.
  dist_and_sub_tx:
    path: s3://data.sb/switchbox/marginal_costs/ct/dist_and_sub_tx/utility=ct_eversource/year=2025/data.parquet
    key: month_hour_occ863att2_secondary_holidays_cal2025
  # bulk_tx: AESC 2024 avoided PTF ($69/kW-yr, 2024$) CPI-adjusted to 2025 and
  # spread by a KDE probability of peak fit on 2022-2025 NE system load. This is
  # the create-bulk-tx-mc-data default (bulk_tx_method=pop_kde).
  # bulk_tx_method=month_hour writes month_hour_occ863att2_aesc_ptf69_holidays_cal2025_2026usd
  # (OCC-863 Attachment 2 page 3 PoP, CPI to 2026$) to the same path.
  # See ct_bulk_transmission_marginal_cost.md.
  bulk_tx:
    path: s3://data.sb/switchbox/marginal_costs/ct/bulk_tx/utility=ct_eversource/year=2025/data.parquet
    key: aesc_ptf69_pop_kde_ne_system_hist2022to2025_cal2025_2026usd
  # No supply MC 8760s exist for CT (no ISO-NE LMP/FCM pipeline wired up yet);
  # point directly at zero.parquet so both delivery and supply runs get zero supply MCs.
  supply_energy:
    path: s3://data.sb/switchbox/marginal_costs/ct/supply/energy/utility=ct_eversource/year=2025/zero.parquet
    key: zero
  supply_capacity:
    path: s3://data.sb/switchbox/marginal_costs/ct/supply/capacity/utility=ct_eversource/year=2025/zero.parquet
    key: zero
    # supply_ancillary omitted
revenue_requirement:
  single_rate: rev_requirement/ct_eversource_rate_case_test_year.yaml
  single_rate_calibrated: rev_requirement/ct_eversource_large_number_rate_case_test_year.yaml
  single_rate_uncalibrated: rev_requirement/ct_eversource_large_number_rate_case_rate_year_1.yaml
  # multi_rate: DERIVED from utility + subgroup aliases (e.g. ct_eversource_hp_vs_nonhp.yaml)
  multi_rate_calibrated: rev_requirement/ct_eversource_large_number_rate_case_test_year.yaml
scenarios:
  default:
    quartet: single_rate
    tariff_base: default
  default_ry1_r1_uncalibrated:
    # Posted Schedule R billed as-is (CAIRO default mode + large-number RR).
    quartet: single_rate_uncalibrated
    tariff_base: rate1_proposed
  default_ry1_r6_uncalibrated:
    # Posted Schedule R billed as-is (CAIRO default mode + large-number RR).
    quartet: single_rate_uncalibrated
    tariff_base: rate6
  default_ry1_r6_ratemc_uncalibrated:
    # Rate 6 RATE=MC: winter Block 2 = marginal cost only (no reconciliation adj).
    quartet: single_rate_uncalibrated
    tariff_base: rate6_ratemc
  default_ry1_r6_fixed_ratemc_uncalibrated:
    # Rate 6 FIXED+RATE=MC: MFC in fixed charge, winter Block 2 = MC only.
    quartet: single_rate_uncalibrated
    tariff_base: rate6_fixed_ratemc
  default_ry1_r6_ratemc_trans_uncalibrated:
    # Rate 6 RATE=MC: winter Block 2 = marginal cost only (no reconciliation adj).
    quartet: single_rate_uncalibrated
    tariff_base: rate6_ratemc_trans
  default_ry1_r6_fixed_ratemc_trans_uncalibrated:
    # Rate 6 FIXED+RATE=MC: MFC in fixed charge, winter Block 2 = MC only.
    quartet: single_rate_uncalibrated
    tariff_base: rate6_fixed_ratemc_trans
  default_ry1_r6_ratemc_mfc0_trans_uncalibrated:
    # Rate 6 RATE=MC, MFC=0, TX=MC: winter Block 2 drops MFC/reconciliation
    # entirely (not moved to fixed charge) and swaps transmission for mc_bulk_tx.
    quartet: single_rate_uncalibrated
    tariff_base: rate6_ratemc_mfc0_trans
  default_ry1_icos_fair_flat_uncalibrated:
    # Fair flat rate: delivery rate set so avg bill_after = avg bill_before + avg ΔMC.
    quartet: single_rate_uncalibrated
    tariff_base: icos_fair_flat
    depends_on: default_ry1_r1_uncalibrated
    derive_method: icos
    structure: flat
    icos:
      heating_types: [natgas, delivered_fuels]
  default_ry1_icos_fair_seasonal_uncalibrated:
    # Fair seasonal rate: summer at base Rate 1, winter adjusted for annual constraint.
    quartet: single_rate_uncalibrated
    tariff_base: icos_fair_seasonal
    depends_on: default_ry1_r1_uncalibrated
    derive_method: icos
    structure: seasonal
    icos:
      heating_types: [natgas, delivered_fuels]
