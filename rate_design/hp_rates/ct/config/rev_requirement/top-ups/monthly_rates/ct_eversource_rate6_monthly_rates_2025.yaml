# CL&P/Eversource Rate 6 (Optional Residential Space Heating) — proposed, PURA Docket 26-05-10.
#
# Hand-encoded from the FILED 2026 rate-case exhibits (delivery vintage), NOT RateAcuity.
# Delivery components come from the filed tariff / rate build (Exhibits CLP-Rates-3, CLP-Rates-2.4,
# CLP-Rates-6); supply is the Genability 2025 seasonal commodity (the case does not set supply).
# Full per-number provenance: context/code/data/ct_eversource_custom_rates.md.
#
# Rate 6 == Rate 1 (Residential) EXCEPT the two rate-class-specific delivery components in
# already_in_drr below: the customer charge and the core distribution rate. All system-wide
# riders, the supply commodity, and the excluded-charge decisions are shared with
# ct_eversource_rate1_proposed_monthly_rates_2025.yaml.
#
# Filed-vintage decisions (these differ from the current RateAcuity ct_eversource top-up):
#   - ESI and RDM are rolled into base distribution in the proposed rates, so they are zeroed
#     here (this also fixes the ESI double-count in the earlier draft).
#   - SBC (-0.00196) is INCLUDED as a real per-kWh bill component. The current ct_eversource
#     top-up drops SBC via exclude_eligibility (a BAT-classification choice); these are
#     bill-calc / comparison tariffs, so we encode what customers actually pay.
#   - CTA (0.00496) and FMCC-Delivery (-0.01911) keep their filed values, including the negative
#     credit; they net into the delivery revenue requirement rather than being floored at zero.
#   - transmission (0.05050) is the FILED value; it differs from RateAcuity 2025 (0.03401 winter /
#     0.04433 summer) by ~1 year of Transmission Adjustment Clause resets (see context doc).
#
# The _2025 suffix is a naming convention only: these hand-built tariffs are not consumed by the
# year-driven fetch pipeline. Delivery is filed-2026 vintage; supply is Genability 2025.
# master_tariff_id is null because this is a proposed rate with no RateAcuity ID.
