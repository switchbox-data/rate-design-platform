# CL&P/Eversource Rate 6 (Optional Residential Space Heating) — proposed, Docket 26-05-10.
# Rate 6 is identical to Rate 1 (Residential, ML 614) EXCEPT for the two rate-class-specific
# delivery components in already_in_drr below: the fixed customer charge and the core
# distribution rate. All system-wide riders (ESI, transmission, CTA, CAM, RE, non-bypassable
# FMCC), the bundled supply commodity, and the excluded-charge decisions are carried over
# unchanged from ct_eversource_monthly_rates_2025.yaml — including Rate 1's treatment of the
# negative credits:
#   - System Benefits Charge (a per-kWh credit): excluded via exclude_eligibility, as in Rate 1,
#     so it never enters the final rate.
#   - CTA: kept at its filed value including the summer negative (-0.00029), as in Rate 1; it
#     nets into the delivery revenue requirement rather than being floored at zero.
# Rate-6-specific values are from the filed tariff (Exhibit CLP-Rates-3):
#   - customer_charge: $30.95/month (Distribution Customer Charge).
#   - core_delivery_rate: $0.09431/kWh (Distribution per kWh). In the heating season (Nov–Mar),
#     consumption over 700 kWh/month is billed at the discounted $0.07517/kWh. The flat
#     monthly_rates shape cannot encode the >700 kWh winter block, so only the first-block /
#     non-heating rate ($0.09431) is shown here; the >700 kWh winter tier lives in the tariff
#     JSON (ct_eversource_rate6.json).
# master_tariff_id is null because Rate 6 is a proposed rate with no RateAcuity ID.
