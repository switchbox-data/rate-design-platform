# CL&P/Eversource proposed Rate 1 (Residential) — matched comparison baseline, PURA Docket 26-05-10.
#
# Hand-encoded from the FILED 2026 rate-case exhibits (delivery vintage), NOT RateAcuity. This is a
# DISTINCT rate keyed ct_eversource_rate1_proposed; the current-vintage RateAcuity ct_eversource
# default is left untouched. It exists so downstream analysis can decompose the delivery bill
# (inclusive of transmission) for Rate 1 vs Rate 6 on a matched basis: only the customer charge and
# core distribution rate below differ from ct_eversource_rate6; every shared rider cancels in the delta.
# Full per-number provenance: context/code/data/ct_eversource_custom_rates.md.
#
# Filed-vintage decisions (identical to ct_eversource_rate6_monthly_rates_2025.yaml):
#   - ESI and RDM are rolled into base distribution in the proposed rates, so they are zeroed here.
#   - SBC (-0.00196) is INCLUDED as a real per-kWh bill component (the current ct_eversource top-up
#     drops it via exclude_eligibility); these are bill-calc / comparison tariffs.
#   - CTA (0.00496) and FMCC-Delivery (-0.01911) keep their filed values, including the negative credit.
#   - transmission (0.05050) is the FILED value; it differs from RateAcuity 2025 (0.03401/0.04433) by
#     ~1 year of Transmission Adjustment Clause resets (see context doc).
#
# The _2025 suffix is a naming convention only: these hand-built tariffs are not consumed by the
# year-driven fetch pipeline. Delivery is filed-2026 vintage; supply is Genability 2025.
# master_tariff_id is null because this is a proposed rate with no RateAcuity ID.
