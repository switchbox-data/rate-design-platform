# CT Eversource (CL&P) — WHOLE residential rate class, rate-case RATE-YEAR 1 YAML (Track 2).
#
# Models every CL&P residential ResStock upgrade-0 dwelling on PROPOSED Rate 1 (incl. GET), sized to
# the WHOLE residential class Rate-Year revenue requirement, kWh, and customer count — the sum of
# Rate 1 + Rate 5 + Rate 7 at Proposed+GET rates, NOT Rate 1 alone. This is the rate-year companion
# to ct_eversource_rate_case_test_year.yaml (test year, current rates).
#
# NOT wired into the year-driven `build-rate-case-test-year` recipe (which hardcodes the current
# monthly_rates file and the canonical output name). Regenerate with a direct script call:
#   uv run python utils/pre/rev_requirement/build_rate_case_test_year.py \
#     --path-partial-yaml rate_design/hp_rates/ct/config/rev_requirement/ct_eversource_rate_case_rate_year_1.yaml \
#     --path-monthly-rates rate_design/hp_rates/ct/config/rev_requirement/top-ups/monthly_rates/ct_eversource_rate1_proposed_monthly_rates_2025.yaml \
#     --path-resstock-release /ebs/data/nrel/resstock/res_2024_amy2018_2_sb --state CT \
#     --output rate_design/hp_rates/ct/config/rev_requirement/ct_eversource_rate_case_rate_year_1.yaml
#
# The ResStock population (sum over sb.electric_utility == ct_eversource — the only CL&P residential
# assignment in CT ResStock) and both scale factors are always recomputed; only the seeded keys and
# their comments below are hand-maintained across re-runs.
#
# Source: PURA Docket 26-05-10, Exhibit CLP-RATES-2 (residential extract:
#   context/sources/exhibit_clp_rates_2_residential.md).
#   Full per-number provenance: context/code/data/ct_eversource_class_rev_requirement.md
#   Rate-Year Proposed+GET distribution functionals are the Exh 2.4 functional-category rollups
#   (R1: exhibit line 92; R5: build at lines 116-117; R7: line 165).
utility: ct_eversource
# --- Whole-class base delivery RR at PROPOSED+GET rates (Customer Charge + Distribution), Rate Year ---
