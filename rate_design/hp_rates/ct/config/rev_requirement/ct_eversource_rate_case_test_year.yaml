# CT Eversource (CL&P) — WHOLE residential rate class, rate-case TEST-YEAR YAML (Track 2).
#
# Models every CL&P residential ResStock upgrade-0 dwelling on Rate 1 at CURRENT rates, but
# sized to the WHOLE residential class revenue requirement, kWh, and customer count — the sum
# of Rate 1 (Residential) + Rate 5 (Residential Electric Heating) + Rate 7 (Residential TOD),
# NOT Rate 1 alone. The Rate-1-only version this replaces is archived at
# ct_eversource_rate1_rate_case_test_year.yaml.
#
# After seeding, run:
#   UTILITY=ct_eversource just s ct build-rate-case-test-year
#
# That script reads this file + ct_eversource_monthly_rates_2025.yaml (current-vintage riders),
# recomputes top-ups / ResStock scaling / totals, and overwrites this same path with the
# completed YAML. The ResStock population (sum over sb.electric_utility == ct_eversource — the
# only CL&P residential assignment in CT ResStock) and both scale factors are always recomputed;
# only the seeded keys and their comments below are hand-maintained across re-runs.
#
# Source: PURA Docket 26-05-10, Exhibit CLP-RATES-2 (residential extract:
#   context/sources/exhibit_clp_rates_2_residential.md).
#   Full per-number provenance: context/code/data/ct_eversource_class_rev_requirement.md
#   Per-rate seed files: ct_eversource_rate1_rate_case_test_year.yaml (archived R1-only),
#   ct_eversource_elecheat_rate_case_test_year.yaml (R5), ct_eversource_tou_rate_case_test_year.yaml (R7).
utility: ct_eversource
# --- Whole-class base delivery RR at CURRENT rates (Customer Charge + Distribution), Test Year ---
