# CT Eversource (CL&P) Rate 1 — partial rate-case test-year YAML (Track 2).
#
# After seeding, run:
#   UTILITY=ct_eversource just s ct build-rate-case-test-year
#
# That script reads this file + monthly_rates, recomputes top-ups / ResStock
# scaling / totals, and overwrites this same path with the completed YAML.
# Comments on keys you seed are preserved across re-runs.
#
# Source: PURA Docket 26-05-10, Exhibit CLP-RATES-2
#   - Bills / kWh: Exhibit CLP-RATES-2.10 p.1 (Schedule E-2.1), Rate 1
#   - Base DRR: Exhibit CLP-RATES-2.4 p.2 (Rate 1 Test Year Ending 2025),
#     Distribution functional category at current normalized rates
#   - Extract: context/sources/exhibit_clp_rates_2_residential.md
utility: ct_eversource
# --- Rate 1 base delivery RR at current rates (Customer Charge + Distribution) ---
# Exh 2.4, R1 Test Year Ending 2025, functional category "Distribution",
# Current Normalized Revenue = $614,065.52 thousand.
# (= Customer Charge $120,786.56k + Distribution energy $493,279.36k).
# Do NOT use Exh 2.10 Total Revenue (~$2.203B) — that is all-in (TX + supply +
# riders). Do NOT use company-wide REVREQ deficiency (~$451M / ~$727M).
# Alternative if calibrating to proposed rates: Proposed Distribution functional
# pre-GET = $1,104,105.62 thousand (same Exh 2.4 tab).
delivery_revenue_requirement_from_rate_case: 614065520.87 # Exh 2.4 R1 TY Dist. functional, current normalized ($000 × 1000)
delivery_revenue_requirement_topups: 819622499.96 # sum(delivery_top_ups.total_budget)
total_delivery_revenue_requirement: 1433688020.83 # delivery_revenue_requirement_from_rate_case + delivery_revenue_requirement_topups
supply_revenue_requirement_topups: 884780069.22 # sum(supply_top_ups.total_budget)
total_delivery_and_supply_revenue_requirement: 2318468090.05 # total_delivery_revenue_requirement + supply_revenue_requirement_topups
delivery_revenue_requirement:
  customer_charge:
    charge_unit: $/month
    budget_method: rate_case
    total_budget: 120786557.42
  core_delivery_rate:
    charge_unit: $/kWh
    budget_method: rate_case
    total_budget: 493280077.87
delivery_top_ups:
  electric_system_improvements_esi:
    charge_unit: $/kWh
    budget_method: rate_case
    total_budget: 162857629.71
  transmission_charge:
    charge_unit: $/kWh
    budget_method: rate_case
    total_budget: 345541878.22
  competitive_transition_assessment_cta:
    charge_unit: $/kWh
    budget_method: rate_case
    total_budget: -588543.12
  conservation_adjustment_mechanism_cam:
    charge_unit: $/kWh
    budget_method: rate_case
    total_budget: 50644771.86
  renewable_energy_investment_clean_energy_fund:
    charge_unit: $/kWh
    budget_method: rate_case
    total_budget: 8440795.31
  non_bypassable_fmcc_nbfmcc:
