    charge_unit: $/kWh
    budget_method: resstock
    total_budget: 884780069.22
# --- Rate 1 test-year weather-normalized total sales ---
# Exh 2.10 p.1 Rate 1: 8,440,795.31 MWh Total Sales × 1000 = kWh.
# (Billed-only from Exh 2.4 is 8,440,783.01 MWh; difference is 12.30 MWh
# primary metering credit.)
test_year_residential_kwh: 8440795309.21 # Exh 2.10 p.1 Rate 1 Total Sales MWh × 1000
# --- Rate 1 average monthly customer bills ---
# Exh 2.10 p.1 / Exh 2.4 billing dets: Average # Bills Rendered (normalized).
# Annual bills = 12,555,775.20 (= this × 12).
test_year_customer_count: 1046314.6 # Exh 2.10 p.1 Rate 1 Avg # Customer Bills Rendered
# --- Optional durable testimony references (preserved across re-runs) ---
# Genability / tariff current customer charge matches the rate-case current rate.
test_year_fixed_charge_from_rate_case: 9.62 # $/month — Exh 2.4 R1 TY Customer Charge current rate
resstock_total_residential_kwh: 7634855865.62 # sum(grid_cons * weight) where utility = ct_eversource
resstock_customer_count: 892895.5 # sum(weight) where utility = ct_eversource
resstock_customer_scale_factor: 1.171822011226765 # test_year_customer_count / resstock_customer_count
resstock_total_residential_kwh_scaled_customer: 8946692155.87 # resstock_total_residential_kwh * resstock_customer_scale_factor
resstock_kwh_scale_factor: 0.9434543138570481 # test_year_residential_kwh / resstock_total_residential_kwh_scaled_customer
resstock_total_residential_kwh_scaled_customer_kwh: 8440795309.21 # = test_year_residential_kwh (sanity check)
