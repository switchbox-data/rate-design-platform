#                              Fixed     Winter ≤700  Winter >700  Non-heating
#                             ($/mo)      ($/kWh)      ($/kWh)      ($/kWh)
# Rate 1 Proposed              12.36      0.16335      0.16335      0.16335
# Rate 6 Filed                 30.95      0.13570      0.11656      0.13570
# Rate 6 RATE=MC               30.95      0.13570      0.08291      0.13570
# Rate 6 FIXED+RATE=MC         57.13      0.09676      0.04397      0.09676
# Rate 6 RATE=MC, TX=MC        30.95      0.13570      0.04073      0.13570
# Rate 6 RATE=MC, MFC=0, TX=MC 30.95      0.13570      0.00179      0.13570
# Rate 6 FIXED+RATE=MC, TX=MC  57.13      0.09676      0.00179      0.09676
