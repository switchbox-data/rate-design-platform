# CT Eversource Tariff Component Summary
#
# Delivery rate decomposition for every tariff modeled in the CT hp_rates analysis.
# All values in $/kWh unless noted. Source: PURA Docket 26-05-10, Exhibit CLP-RATES-3
# (filed tariff schedules) and Exhibit CLP-RATES-6 (Rate 6 worksheet).
#
# Provenance doc: context/code/data/ct_eversource_custom_rates.md
# ─────────────────────────────────────────────────────────────────────────────
# Shared delivery riders — flat per-kWh, identical for Rate 1 and all Rate 6
# variants. These are pass-through adjustment clauses set outside the rate case.
# ─────────────────────────────────────────────────────────────────────────────
shared_riders:
  transmission: 0.05050 # Exh CLP-RATES-3 p.243 / p.249
  competitive_transition_assessment: 0.00496 # Exh CLP-RATES-3 p.243 / p.249
  systems_benefits_charge: -0.00196 # Exh CLP-RATES-3 p.243 / p.249 (credit)
  conservation_adjustment_mechanism: 0.00600 # Exh CLP-RATES-3 p.243 / p.249
  renewable_energy: 0.00100 # Exh CLP-RATES-3 p.243 / p.249
  fmcc_delivery: -0.01911 # Exh CLP-RATES-3 p.243 / p.249 (credit)
  electric_system_improvements: 0.00000 # Rolled into distribution (ESI sunsets)
  revenue_decoupling_mechanism: 0.00000 # Rolled into distribution
  total: 0.04139 # = sum of above
  # Decomposition used in per-tier breakdowns below:
  #   transmission:  0.05050
  #   other:        -0.00911   (= total − transmission = CTA + SBC + CAM + RE + FMCC + ESI + RDM)
# Supply commodity (Genability 2025 seasonal, same for all tariffs)
supply_commodity:
  jan_jun: 0.11190 # $/kWh
  jul_dec: 0.09748 # $/kWh
# Marginal cost of bulk transmission — AESC 2024 avoided PTF, flat $/kWh
# Source: AESC 2024 (Synapse), $69/kW-yr in 2024$, CPI-inflated to 2026$
#   $69 × (CPI_2026 / CPI_2024) / 8760 = $69 × (331.28 / 313.70) / 8760 = $0.00832/kWh
mc_bulk_tx: 0.00832 # $/kWh (2026$)
# ─────────────────────────────────────────────────────────────────────────────
# Rate 1 Proposed — ct_eversource_rate1_proposed
# Flat volumetric, no seasons, no tiers.
# Source: Exh CLP-RATES-3 p.243; Exh CLP-RATES-6 p.3 line 172
# ─────────────────────────────────────────────────────────────────────────────
rate1_proposed:
  fixed_charge_per_month: 12.36 # Exh CLP-RATES-2.4 R1 RY Proposed+GET Customer Charge
  all_months_all_kwh:
    distribution: 0.12196 # incl. GET; ESI/RDM folded in
    riders_transmission: 0.05050 # shared_riders.transmission
    riders_other: -0.00911 # shared_riders other (CTA+SBC+CAM+RE+FMCC+ESI+RDM)
    riders_total: 0.04139 # = riders_transmission + riders_other
    delivery_total: 0.16335 # = distribution + riders_total → JSON rate
# ─────────────────────────────────────────────────────────────────────────────
# Rate 6 Filed — ct_eversource_rate6
# Seasonal tiered: winter (Nov–Mar) Block 1 ≤700 kWh / Block 2 >700 kWh;
# non-heating (Apr–Oct) flat at Block 1 rate.
# Source: Exh CLP-RATES-3 p.249; Exh CLP-RATES-6 p.2
# ─────────────────────────────────────────────────────────────────────────────
rate6_filed:
  fixed_charge_per_month: 30.95 # MCC $28.98 × 1.068 GET
  winter_block1_le_700kwh: # Nov–Mar, first 700 kWh
    distribution: 0.09431 # Class EC RR $796,054,171 / 8,440,783,007 kWh
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.13570
  winter_block2_gt_700kwh: # Nov–Mar, above 700 kWh
    distribution: 0.07517 # Block 1 $0.09431 − discount $0.01914
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.11656
    # Discount build-up (Exh CLP-RATES-6 p.2):
    #   MC subtotal       = $0.04152 (FC recovery w/GET $0.03894 + MC Energy w/GET $0.00258)
    #   Reconciliation    = $0.03365 (residual $0.05279 × coinc. factor 63.7%)
    #   Block 2           = MC subtotal + reconciliation = $0.07517
  non_heating_all_kwh: # Apr–Oct, all kWh
    distribution: 0.09431
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.13570
# ─────────────────────────────────────────────────────────────────────────────
# Rate 6 RATE=MC — ct_eversource_rate6_ratemc
# Same as filed Rate 6, but coincidence-factor adjustment set to 0%,
# zeroing the reconciliation adjustment. Block 1 and fixed charge unchanged.
# Source: Google Sheets tab "CLP-RATES-6, 2 of 3 (RATE=MC)"
# ─────────────────────────────────────────────────────────────────────────────
rate6_ratemc:
  fixed_charge_per_month: 30.95 # unchanged
  winter_block1_le_700kwh:
    distribution: 0.09431 # unchanged
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.13570
  winter_block2_gt_700kwh:
    distribution: 0.04152 # = MC subtotal only (FC recovery $0.03894 + MC Energy $0.00258)
    riders_transmission: 0.05050 # reconciliation adj zeroed (coinc. factor = 0%)
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.08291
  non_heating_all_kwh:
    distribution: 0.09431
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.13570
# ─────────────────────────────────────────────────────────────────────────────
# Rate 6 FIXED+RATE=MC — ct_eversource_rate6_fixed_ratemc
# Marginal Facilities Cost ($24.51/mo) moved into fixed charge;
# coincidence-factor adjustment also set to 0%.
# Source: Google Sheets tab "CLP-RATES-6, 2 of 3 (FIXED + RATE=MC)"
# ─────────────────────────────────────────────────────────────────────────────
rate6_fixed_ratemc:
  fixed_charge_per_month: 57.13 # ($28.98 MCC + $24.51 MFC) × 1.068 GET
  winter_block1_le_700kwh:
    distribution: 0.05537 # EC RR $467,385,662 / 8,440,783,007 kWh
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.09676
  winter_block2_gt_700kwh:
    distribution: 0.00258 # = MC Energy w/GET only (FC recovery in fixed charge, recon = 0)
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.04397
  non_heating_all_kwh:
    distribution: 0.05537
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.09676
# ─────────────────────────────────────────────────────────────────────────────
# Rate 6 RATE=MC, TX=MC — ct_eversource_rate6_ratemc_trans
# Same as RATE=MC, but winter Block 2 transmission rider replaced with the
# marginal cost of bulk transmission (AESC 2024, $69/kW-yr → 2026$ → ÷8760).
# Block 1, non-heating, and fixed charge unchanged from RATE=MC.
# ─────────────────────────────────────────────────────────────────────────────
rate6_ratemc_trans:
  fixed_charge_per_month: 30.95 # unchanged
  winter_block1_le_700kwh:
    distribution: 0.09431 # unchanged
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.13570
  winter_block2_gt_700kwh:
    distribution: 0.04152 # = MC subtotal only (same as rate6_ratemc)
    riders_transmission: 0.00832 # = mc_bulk_tx: AESC $69/kW-yr (2024$) → 2026$ → ÷8760
    riders_other: -0.00911
    riders_total: -0.00079 # = 0.00832 + (-0.00911)
    delivery_total: 0.04073 # = 0.04152 + (-0.00079)
  non_heating_all_kwh:
    distribution: 0.09431
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.13570
# ─────────────────────────────────────────────────────────────────────────────
# Rate 6 RATE=MC, MFC=0, TX=MC — ct_eversource_rate6_ratemc_mfc0_trans
# Same as RATE=MC, but winter Block 2 drops the Unit FC Recovery (MFC) and
# reconciliation adjustment entirely (not moved to fixed charge), and the
# transmission rider is replaced with the marginal cost of bulk transmission.
# Block 1, non-heating, and fixed charge unchanged from RATE=MC.
# Source: Google Sheets tab "CLP-RATES-6, 2 of 3 (RATE=MC, MFC=0)"
# ─────────────────────────────────────────────────────────────────────────────
rate6_ratemc_mfc0_trans:
  fixed_charge_per_month: 30.95 # unchanged
  winter_block1_le_700kwh:
    distribution: 0.09431 # unchanged
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.13570
  winter_block2_gt_700kwh:
    distribution: 0.00258 # = MC Energy w/GET only; MFC (FC recovery) dropped entirely
    riders_transmission: 0.00832 # = mc_bulk_tx: AESC $69/kW-yr (2024$) → 2026$ → ÷8760
    riders_other: -0.00911
    riders_total: -0.00079 # = 0.00832 + (-0.00911)
    delivery_total: 0.00179 # = 0.00258 + (-0.00079)
  non_heating_all_kwh:
    distribution: 0.09431
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.13570
# ─────────────────────────────────────────────────────────────────────────────
# Rate 6 FIXED+RATE=MC, TX=MC — ct_eversource_rate6_fixed_ratemc_trans
# Same as FIXED+RATE=MC, but winter Block 2 transmission rider replaced with
# the marginal cost of bulk transmission.
# Block 1, non-heating, and fixed charge unchanged from FIXED+RATE=MC.
# ─────────────────────────────────────────────────────────────────────────────
rate6_fixed_ratemc_trans:
  fixed_charge_per_month: 57.13 # unchanged from FIXED+RATE=MC
  winter_block1_le_700kwh:
    distribution: 0.05537 # unchanged from FIXED+RATE=MC
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.09676
  winter_block2_gt_700kwh:
    distribution: 0.00258 # = MC Energy w/GET only (same as rate6_fixed_ratemc)
    riders_transmission: 0.00832 # = mc_bulk_tx: AESC $69/kW-yr (2024$) → 2026$ → ÷8760
    riders_other: -0.00911
    riders_total: -0.00079 # = 0.00832 + (-0.00911)
    delivery_total: 0.00179 # = 0.00258 + (-0.00079)
  non_heating_all_kwh:
    distribution: 0.05537
    riders_transmission: 0.05050
    riders_other: -0.00911
    riders_total: 0.04139
    delivery_total: 0.09676
# ─────────────────────────────────────────────────────────────────────────────
# Synapse TOU — ct_eversource_synapse_tou
# OCC (Whited) proposed seasonal TOU electrification rate. Summer = Jun–Sep;
# on-peak = 4pm–8pm (hours 16–19) on weekdays, all year; weekends all off-peak.
# CAIRO localizes loads to EST with no DST, so while DST is in effect the
# modeled on-peak window falls at 5pm–9pm clock time. Holidays are not off-peak.
# Delivery = distribution + transmission only: Table 5 has no line for the
# other riders (CTA, SBC, CAM, RE, FMCC), so they are excluded.
# The _supply tariff adds Whited's TOU supply column in place of the
# Genability supply commodity used by every other tariff here.
# Totals are sums of the components; Table 5's printed totals for summer
# on-peak (1.168646) and winter on-peak (0.273802) differ by 0.000001 (rounding).
# Source: PURA Docket 26-05-10, Whited Direct Testimony for OCC, Table 5 (p. 36)
# ─────────────────────────────────────────────────────────────────────────────
synapse_tou:
  fixed_charge_per_month: 30.95
  winter_off_peak: # period 0
    distribution: 0.000034
    transmission: 0.036675
    supply: 0.125959
    delivery_total: 0.036709
    delivery_supply_total: 0.162668
  winter_on_peak: # period 1
    distribution: 0.000308
    transmission: 0.121434
    supply: 0.152059
    delivery_total: 0.121742
    delivery_supply_total: 0.273801
  summer_off_peak: # period 2
    distribution: 0.157286
    transmission: 0.036675
    supply: 0.076061
    delivery_total: 0.193961
    delivery_supply_total: 0.270022
  summer_on_peak: # period 3
    distribution: 0.658974
    transmission: 0.121434
    supply: 0.388237
    delivery_total: 0.780408
    delivery_supply_total: 1.168645

