# CT Eversource Tariff Component Summary
#
# Delivery rate decomposition for every tariff modeled in the CT hp_rates analysis.
# All values in $/kWh unless noted. Source: PURA Docket 26-05-10, Exhibit CLP-RATES-3
# (filed tariff schedules) and Exhibit CLP-RATES-6 (Rate 6 worksheet).
#
# Provenance doc: context/code/data/ct_eversource_custom_rates.md

# ─────────────────────────────────────────────────────────────────────────────
# Shared delivery riders — flat per-kWh, identical for Rate 1 and all Rate 6
# variants. These are pass-through adjustment clauses set outside the rate case.
# ─────────────────────────────────────────────────────────────────────────────
shared_riders:
  transmission:                       0.05050   # Exh CLP-RATES-3 p.243 / p.249
  competitive_transition_assessment:  0.00496   # Exh CLP-RATES-3 p.243 / p.249
  systems_benefits_charge:           -0.00196   # Exh CLP-RATES-3 p.243 / p.249 (credit)
  conservation_adjustment_mechanism:  0.00600   # Exh CLP-RATES-3 p.243 / p.249
  renewable_energy:                   0.00100   # Exh CLP-RATES-3 p.243 / p.249
  fmcc_delivery:                     -0.01911   # Exh CLP-RATES-3 p.243 / p.249 (credit)
  electric_system_improvements:       0.00000   # Rolled into distribution (ESI sunsets)
  revenue_decoupling_mechanism:       0.00000   # Rolled into distribution
  total:                              0.04139   # = sum of above

# Supply commodity (Genability 2025 seasonal, same for all tariffs)
supply_commodity:
  jan_jun:  0.11190   # $/kWh
  jul_dec:  0.09748   # $/kWh

# ─────────────────────────────────────────────────────────────────────────────
# Rate 1 Proposed — ct_eversource_rate1_proposed
# Flat volumetric, no seasons, no tiers.
# Source: Exh CLP-RATES-3 p.243; Exh CLP-RATES-6 p.3 line 172
# ─────────────────────────────────────────────────────────────────────────────
rate1_proposed:
  fixed_charge_per_month:  12.36      # Exh CLP-RATES-2.4 R1 RY Proposed+GET Customer Charge

  all_months_all_kwh:
    distribution:          0.12196    # incl. GET; ESI/RDM folded in
    riders:                0.04139    # shared_riders.total
    delivery_total:        0.16335    # = distribution + riders → JSON rate

# ─────────────────────────────────────────────────────────────────────────────
# Rate 6 Filed — ct_eversource_rate6
# Seasonal tiered: winter (Nov–Mar) Block 1 ≤700 kWh / Block 2 >700 kWh;
# non-heating (Apr–Oct) flat at Block 1 rate.
# Source: Exh CLP-RATES-3 p.249; Exh CLP-RATES-6 p.2
# ─────────────────────────────────────────────────────────────────────────────
rate6_filed:
  fixed_charge_per_month:  30.95      # MCC $28.98 × 1.068 GET

  winter_block1_le_700kwh:            # Nov–Mar, first 700 kWh
    distribution:          0.09431    # Class EC RR $796,054,171 / 8,440,783,007 kWh
    riders:                0.04139
    delivery_total:        0.13570

  winter_block2_gt_700kwh:            # Nov–Mar, above 700 kWh
    distribution:          0.07517    # Block 1 $0.09431 − discount $0.01914
    riders:                0.04139
    delivery_total:        0.11656
    # Discount build-up (Exh CLP-RATES-6 p.2):
    #   MC subtotal       = $0.04152 (FC recovery w/GET $0.03894 + MC Energy w/GET $0.00258)
    #   Reconciliation    = $0.03365 (residual $0.05279 × coinc. factor 63.7%)
    #   Block 2           = MC subtotal + reconciliation = $0.07517

  non_heating_all_kwh:                # Apr–Oct, all kWh
    distribution:          0.09431
    riders:                0.04139
    delivery_total:        0.13570

# ─────────────────────────────────────────────────────────────────────────────
# Rate 6 RATE=MC — ct_eversource_rate6_ratemc
# Same as filed Rate 6, but coincidence-factor adjustment set to 0%,
# zeroing the reconciliation adjustment. Block 1 and fixed charge unchanged.
# Source: Google Sheets tab "CLP-RATES-6, 2 of 3 (RATE=MC)"
# ─────────────────────────────────────────────────────────────────────────────
rate6_ratemc:
  fixed_charge_per_month:  30.95      # unchanged

  winter_block1_le_700kwh:
    distribution:          0.09431    # unchanged
    riders:                0.04139
    delivery_total:        0.13570

  winter_block2_gt_700kwh:
    distribution:          0.04152    # = MC subtotal only (FC recovery $0.03894 + MC Energy $0.00258)
    riders:                0.04139    # reconciliation adj zeroed (coinc. factor = 0%)
    delivery_total:        0.08291

  non_heating_all_kwh:
    distribution:          0.09431
    riders:                0.04139
    delivery_total:        0.13570

# ─────────────────────────────────────────────────────────────────────────────
# Rate 6 FIXED+RATE=MC — ct_eversource_rate6_fixed_ratemc
# Marginal Facilities Cost ($24.51/mo) moved into fixed charge;
# coincidence-factor adjustment also set to 0%.
# Source: Google Sheets tab "CLP-RATES-6, 2 of 3 (FIXED + RATE=MC)"
# ─────────────────────────────────────────────────────────────────────────────
rate6_fixed_ratemc:
  fixed_charge_per_month:  57.13      # ($28.98 MCC + $24.51 MFC) × 1.068 GET

  winter_block1_le_700kwh:
    distribution:          0.05537    # EC RR $467,385,662 / 8,440,783,007 kWh
    riders:                0.04139
    delivery_total:        0.09676

  winter_block2_gt_700kwh:
    distribution:          0.00258    # = MC Energy w/GET only (FC recovery in fixed charge, recon = 0)
    riders:                0.04139
    delivery_total:        0.04397

  non_heating_all_kwh:
    distribution:          0.05537
    riders:                0.04139
    delivery_total:        0.09676

# ─────────────────────────────────────────────────────────────────────────────
# Side-by-side summary (delivery only)
# ─────────────────────────────────────────────────────────────────────────────
#
#                         Fixed     Winter ≤700  Winter >700  Non-heating
#                        ($/mo)      ($/kWh)      ($/kWh)      ($/kWh)
# Rate 1 Proposed         12.36      0.16335      0.16335      0.16335
# Rate 6 Filed            30.95      0.13570      0.11656      0.13570
# Rate 6 RATE=MC          30.95      0.13570      0.08291      0.13570
