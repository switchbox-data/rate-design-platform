# Connecticut marginal-cost allocation. Defaults match ct/Justfile.
# Distribution default is month_hour. Bulk transmission default is pop_kde.
# Top-N load-share is the two distribution alternatives. Top-N exceedance is
# the bulk-transmission alternative isone_aesc_ptf.
state: ct
dist_and_sub_tx:
  method: month_hour
  output_column: mc_total_per_kwh
  manifest_method: month_hour
  utilities: [ct_eversource]
  output_base: s3://data.sb/switchbox/marginal_costs/ct/dist_and_sub_tx/
  inputs:
    table_kind: rates
    include_holidays: true
    calendar_year: "{year}"
    year: "{year}"
    annual_cost_kw_year:
      from: mc_table
      path: rate_design/hp_rates/ct/config/marginal_costs/ct_marginal_costs_{year}.csv
      column: sub_tx_and_dist_mc_kw_yr
      dollar_year_column: dollar_year
      target_dollar_year: 2026
    weekday:
      from: parquet
      path: s3://data.sb/switchbox/sources/ct/eversource/docket-26-05-10/occ-863/parquet/month_hour_marginal_costs_weekday_secondary.parquet
    weekend:
      from: parquet
      path: s3://data.sb/switchbox/sources/ct/eversource/docket-26-05-10/occ-863/parquet/month_hour_marginal_costs_weekend_holidays_secondary.parquet
  alternatives:
    pop_occ863:
      method: top_n_load_share
      manifest_method: pop
      inputs:
        n_hours: 100
        annual_cost_kw_year:
          from: mc_table
          path: rate_design/hp_rates/ct/config/marginal_costs/ct_marginal_costs_{year}.csv
          column: sub_tx_and_dist_mc_kw_yr
          dollar_year_column: dollar_year
          target_dollar_year: 2026
        load:
          from: parquet
          path: s3://data.sb/switchbox/sources/ct/eversource/docket-26-05-10/occ-863/parquet/system_load.parquet
          load_source: occ863att3
          load_year: "{load_year}"
    pop_isone_zone:
      method: top_n_load_share
      manifest_method: pop
      inputs:
        n_hours: 100
        annual_cost_kw_year:
          from: mc_table
          path: rate_design/hp_rates/ct/config/marginal_costs/ct_marginal_costs_{year}.csv
          column: sub_tx_and_dist_mc_kw_yr
          dollar_year_column: dollar_year
          target_dollar_year: 2026
        load:
          from: hive_load
          path: s3://data.sb/isone/hourly_demand/utilities/
          load_source: isone_zone
          load_year: "{load_year}"
bulk_tx:
  method: pop_kde
  output_column: bulk_tx_cost_enduse
  manifest_method: isone_aesc_ptf_pop_kde
  utilities: [ct_eversource, ct_ui]
  output_base: s3://data.sb/switchbox/marginal_costs/ct/bulk_tx/
  inputs:
    year: "{year}"
    calendar_year: "{year}"
    annual_cost_kw_year:
      from: cpi
      value: 69.0
      dollar_year: 2024
      target_dollar_year: 2026
      cpi_s3_base: s3://data.sb/fred/cpi/
    load:
      from: zone_sum_load
      path: s3://data.sb/isone/hourly_demand/zones/
      zones: [CT, ME, NEMA, NH, RI, SEMA, VT, WCMA]
      history_years: [2022, 2023, 2024, 2025]
  alternatives:
    isone_aesc_ptf:
      method: top_n_exceedance
      manifest_method: isone_aesc_ptf
      utilities: [ct_eversource, ct_ui]
      inputs:
        n_hours: 100
        annual_cost_kw_year:
          from: literal
          value: 69.0
        load:
          from: zone_sum_load
          path: s3://data.sb/isone/hourly_demand/zones/
          zones: [CT, ME, NEMA, NH, RI, SEMA, VT, WCMA]
          year: "{load_year}"
