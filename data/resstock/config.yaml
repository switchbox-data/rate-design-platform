# ResStock pipeline defaults.
#
# Single source of truth for the fetch/modify/upload pipeline.
# Read by nrel/fetch_resstock_data.py, main.py, and the Justfile.
# Update here when switching to a new ResStock release or adding upgrade IDs.
resstock:
  release_year: 2024
  weather_file: amy2018
  release_version: 2
  upgrade_ids:
    - "0"
    - "1"
    - "2"
    - "3"
    - "4"
    - "5"
  # Subset of upgrade_ids that receive the MF non-HVAC electricity adjustment.
  # Typically the baseline (00) and the heat-pump upgrade (02).
  # Update here when switching to a release with different upgrade numbering.
  mf_adj_upgrade_ids:
    - "00"
    - "02"
  # Subset of upgrade_ids that receive the non-HP load approximation
  # (k-nearest-neighbor HVAC substitution). Typically the heat-pump upgrades.
  # Update here when switching to a release with different upgrade numbering.
  approx_upgrade_ids:
    - "01"
    - "02"
  # Upgrade used as the input for utility assignment. Assignment is per-state
  # (not per-upgrade), so only one upgrade's metadata is needed as input.
  utility_assign_upgrade_id: "00"
  file_types:
    - metadata
    - load_curve_hourly
    - load_curve_annual
paths:
  output_dir: /ebs/data/nrel/resstock
  s3_dir: s3://data.sb/nrel/resstock
  s3_pums_dir: s3://data.sb/census/pums
  # EIA-861 utility stats (year=<YYYY>/state=<ST>/data.parquet), read by the
  # real-world checks.
  s3_eia861_dir: s3://data.sb/eia/861/electric_utility_stats
  s3_gis_dir: s3://data.sb/gis/utility_boundaries/
  # S3 URI for PUMA boundary shapefiles (state-partitioned: .../state=XX/).
  s3_pumas_dir: s3://data.sb/gis/pumas
  # Local EBS directory for caching GIS files (utility boundaries, PUMAs).
  gis_cache_dir: /ebs/data/gis
pums:
  survey: acs5
  year: "2021"
# End-of-pipeline comparisons of the upgrade-00 stock against EIA-861, EIA-176,
# and ACS PUMS (data/resstock/validations/real_world_checks.py). They only warn.
# Percent tolerances are in percent; "_pp" tolerances are percentage points.
# Per-state overrides go under real_world_checks in state_configs.yaml.
real_world_checks:
  tolerances:
    electric_customers_statewide_pct: 10
    electric_customers_utility_pct: 20
    electric_kwh_statewide_pct: 10
    electric_kwh_utility_pct: 20
    electric_kwh_sb_drift_pp: 5
    gas_kwh_statewide_scaled_pct: 1
    gas_kwh_statewide_unscaled_pct: 15
    # Each gas utility's share of mapped-utility gas use, ResStock vs EIA-176.
    gas_share_utility_pp: 5
    gas_share_utility_pct: 25
    gas_meters_band_pct: 10
    hp_approx_max_share_pct: 35
    # Heating fuel, building type, year built: each category's share, ResStock
    # vs ACS. The relative check skips categories below acs_share_min_pct.
    acs_share_pp: 5
    acs_share_pct: 25
    acs_share_min_pct: 2
    acs_master_metering_pp: 5
    # Comparisons on a slice of the sample (one utility or category) use
    # max(tolerance, z / sqrt(n_buildings)), so a gap within z standard errors
    # of ResStock sampling noise doesn't warn.
    sampling_noise_z: 2
  # Known, accepted mismatches: "<check>" or "<check>:<scope>",
  # e.g. "electric_kwh_utility:utility=frp".
  ignore: []
